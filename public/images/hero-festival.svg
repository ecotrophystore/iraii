<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg" cx="65%" cy="30%" r="95%">
      <stop offset="0%" stop-color="#8c3a33"/>
      <stop offset="50%" stop-color="#5c1a1b"/>
      <stop offset="100%" stop-color="#2e1213"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c79a5c"/>
      <stop offset="60%" stop-color="#8a5f34"/>
      <stop offset="100%" stop-color="#5a3a1e"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d8a2"/>
      <stop offset="100%" stop-color="#b8924a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f1d58a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f1d58a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1040" cy="420" r="340" fill="url(#glow)"/>
  <!-- carved panel -->
  <g transform="translate(1000 120)">
    <rect width="380" height="560" rx="8" fill="url(#panel)"/>
    <rect x="14" y="14" width="352" height="532" rx="4" fill="none" stroke="#f3d8a2" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="186" y="60" width="8" height="440" rx="4" fill="url(#brass)"/>
    <polygon points="190,30 240,120 190,170 140,120" fill="url(#brass)"/>
  </g>
  <!-- lamp -->
  <g transform="translate(560 470)">
    <ellipse cx="0" cy="170" rx="160" ry="22" fill="#2e1213" fill-opacity="0.6"/>
    <path d="M-120 170 Q-120 60 0 40 Q120 60 120 170 Z" fill="url(#brass)"/>
    <rect x="-18" y="-40" width="36" height="90" fill="url(#brass)"/>
    <ellipse cx="0" cy="-48" rx="62" ry="16" fill="#f1d58a"/>
    <ellipse cx="0" cy="-48" rx="110" ry="60" fill="url(#glow)"/>
  </g>
</svg>
